    <text x="130" y="80" font-size="16">Platzhalterfoto · STA4-03</text>
    <g fill="#111">
    <text x="40" y="130" font-size="19" fill="#111">GEFAHR! Hochspannung. Vor Wartung</text>
    <text x="40" y="154" font-size="19" fill="#111">abschalten.</text>
    <text x="40" y="178" font-size="19" fill="#111"></text>
    <text x="40" y="202" font-size="19" fill="#111">NIEBEZPIECZEŃSTWO! Wysokie</text>
    <text x="40" y="226" font-size="19" fill="#111">napięcie. Wyłączyć przed</text>
    <text x="40" y="250" font-size="19" fill="#111">konserwacją.</text>
